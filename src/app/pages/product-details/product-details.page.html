<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>تفاصيل المنتج</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="product" style="text-align: center;">
    <img [src]="product.image" style="max-height: 300px; width: 100%; object-fit: contain;" />
    <h1 style="margin-top: 20px;">{{ product.title }}</h1>
    <h3 color="success">{{ product.price }} جنيه</h3>
    <p style="color: #666; margin: 20px 0;">هذا المنتج من أفضل الخامات المتاحة في قسم {{ product.category }} وهو متوفر حالياً بخصم خاص.</p>
    
    <ion-button expand="block" shape="round">إضافة إلى السلة</ion-button>
  </div>
</ion-content>
